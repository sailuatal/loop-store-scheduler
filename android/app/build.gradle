plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.loop.suzhou.scheduler'
    compileSdk 35

    defaultConfig {
        applicationId 'cn.loop.suzhou.scheduler'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
